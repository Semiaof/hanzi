<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="汉字书写">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f4f0">
<meta name="format-detection" content="telephone=no">

<meta name="copyright" content="© 2026 李牧飞 Aphisit Kaewnet">
<title>中文很难 · ฝึกเขียนอักษรจีน</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/KaiTi-Web.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="css/app.css?v=14">
<script>
  /* apply the saved / system theme before first paint */
  (function () {
    var t = null;
    try { t = localStorage.getItem('hanzi_theme'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cnchar@3/cnchar.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cnchar-order@3/cnchar.order.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cnchar-radical@3/cnchar.radical.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="logo" href="#home" aria-label="หน้าแรก">
      <span class="logo-mark zh" aria-hidden="true">汉</span>
      <span class="logo-txt"><b class="zh">汉字书写</b><small>ฝึกเขียนอักษรจีน</small></span>
    </a>
    <nav class="mainnav" aria-label="เมนูหลัก">
      <a href="#home" data-nav="home">หน้าแรก</a>
      <a href="#practice" data-nav="practice">ฝึกเขียน</a>
      <a href="#explore" data-nav="explore">สำรวจ</a>
      <a href="#search" data-nav="search">ค้นหา</a>
    </nav>
    <a class="search-pill" href="#search" aria-label="ค้นหาอักษร">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>ค้นอักษร หรือคำแปล</span>
    </a>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="สลับโหมดกลางวัน / กลางคืน">
      <svg class="moon" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <svg class="sun" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <!-- Home, Explore and Search are rendered by js/app.js -->
  <section class="page" id="page-home"></section>

  <!-- ================= PRACTICE ================= -->
  <section class="page" id="page-practice">
    <div class="pr-head">
      <div class="queue" id="studioCharPills" aria-label="ตัวอักษรในชุดฝึก"></div>
      <button class="btn soft sm" id="editQueueBtn" aria-expanded="false">เปลี่ยนชุด</button>
    </div>
    <div class="queue-editor" id="queueEditor" hidden>
      <div class="qe-row">
        <input id="studioCharInput" value="永水火木心爱清道" placeholder="พิมพ์อักษรจีนที่อยากฝึก" aria-label="ชุดอักษรที่ต้องการฝึก" enterkeyhint="done" autocomplete="off">
        <button class="btn primary" id="studioLoadBtn">ใช้ชุดนี้</button>
      </div>
      <div class="qe-presets" id="queuePresets"></div>
    </div>

    <div class="pr-grid">
      <div class="board-col">
        <div class="board-card">
          <div class="board" id="stCanvasStage">
            <canvas id="stInkCanvas"></canvas>
            <canvas id="stHoverCanvas"></canvas>
          </div>
          <div class="toolpill" role="toolbar" aria-label="เครื่องมือเขียน">
            <div class="tp-group" id="stToolSeg">
              <button data-tool="brush" class="active" aria-label="พู่กัน"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14.5 4.5l5 5-7.5 7.5-5-5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 12c-2.5 0-3.5 2-3.5 4 0 1.5-.8 2.6-1.5 3.5 3 .3 6.5-.5 7.5-3.5" fill="currentColor"/></svg><em>พู่กัน</em></button>
              <button data-tool="pen" aria-label="ปากกา"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20l1.2-4.6L16 4.6a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><em>ปากกา</em></button>
              <button data-tool="eraser" aria-label="ยางลบ"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8.5 19.5l-4-4a1.8 1.8 0 0 1 0-2.5l8.5-8.5a1.8 1.8 0 0 1 2.5 0l4 4a1.8 1.8 0 0 1 0 2.5l-8 8.5zM9 19.5h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg><em>ยางลบ</em></button>
            </div>
            <span class="tp-sep"></span>
            <div class="tp-group tp-colors" id="stColorSeg">
              <button class="color-dot active" data-color="#1b1f2a" style="--c:#1b1f2a" aria-label="หมึกดำ"></button>
              <button class="color-dot" data-color="#d1432a" style="--c:#d1432a" aria-label="หมึกแดง"></button>
              <button class="color-dot" data-color="#2f62c9" style="--c:#2f62c9" aria-label="หมึกน้ำเงิน"></button>
            </div>
            <span class="tp-sep"></span>
            <label class="tp-size" aria-label="ขนาดพู่กัน"><input type="range" id="stBrushSize" min="6" max="38" value="18"><b id="stBrushSizeVal" hidden>18px</b></label>
            <span class="tp-sep"></span>
            <div class="tp-group">
              <button id="stUndoBtn" aria-label="ย้อนกลับ"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 7L4.5 11.5 9 16M5 11.5h9a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><em>ย้อน</em></button>
              <button id="stClearBtn" aria-label="ล้างกระดาน"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><em>ล้าง</em></button>
            </div>
          </div>
          <div class="board-opts">
            <div class="opt"><span>เงา</span>
              <div class="seg" id="stGhostSeg">
                <button data-ghost="0.22" class="active">ชัด</button><button data-ghost="0.08">จาง</button><button data-ghost="0">ไม่มี</button>
              </div>
            </div>
            <div class="opt"><span>ตาราง</span>
              <div class="seg zhseg" id="stGridTypeSeg">
                <button data-grid="mi" class="active">米</button><button data-grid="tian">田</button><button data-grid="jiu">九</button>
              </div>
            </div>
            <button class="link-btn" id="stSaveImgBtn">บันทึกรูป</button>
            <details class="pencil-more">
              <summary>Apple Pencil</summary>
              <label class="palm"><input type="checkbox" id="stPalmRejectToggle"> กันอุ้งมือ</label>
              <div class="tele" id="stTelemetryBar">
                <span><i class="tele-dot" id="stInputDot"></i><b id="stInputType">—</b></span>
                <span>แรงกด <span class="tele-meter"><span class="tele-fill" id="stPressureFill" style="width:0%"></span></span> <b id="stPressureVal">0%</b></span>
                <span>เอียง <b id="stTiltVal">0°, 0°</b></span>
                <span>หมุน <b id="stTwistVal">0°</b></span>
              </div>
            </details>
          </div>
        </div>
      </div>

      <aside class="ref-col">
        <div class="ref-card">
          <div class="ref-top">
            <div class="ref-id">
              <span class="ref-glyph zh" id="stActiveChar">永</span>
              <div>
                <div class="ref-py" id="stActivePy">yǒng</div>
                <div class="ref-th" id="stActiveTh">นิรันดร์</div>
                <div class="ref-en" id="stActiveEn">forever</div>
              </div>
            </div>
            <div class="ref-actions">
              <button class="icon-btn" id="stSpeakBtn" aria-label="ฟังเสียง"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
              <button class="icon-btn" id="stDetailModalBtn" aria-label="รายละเอียด"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.2" fill="currentColor"/></svg></button>
            </div>
          </div>
          <div class="ref-boxes">
            <div class="ref-box">
              <div class="tian" style="width:132px;height:132px" id="stAnimHost"></div>
              <span>ลำดับขีด</span>
            </div>
            <div class="ref-box">
              <div class="tian" style="width:132px;height:132px" id="stCompSvgHost"></div>
              <span id="stStrokeCountTxt">ชิ้นส่วน</span>
            </div>
          </div>
          <div class="ref-btns">
            <button class="btn soft sm" id="stReplayAnimBtn">เล่นใหม่</button>
            <button class="btn soft sm" id="stQuizModeBtn">ทดสอบในกรอบ</button>
          </div>
          <div class="ref-summary" id="stCompSummary"></div>
          <div class="steps ref-steps" id="stStepsHost"></div>
        </div>
        <div class="pr-nav">
          <button class="btn soft" id="stPrevCharBtn">‹ ก่อนหน้า</button>
          <button class="btn primary" id="stNextCharBtn">ตัวถัดไป ›</button>
        </div>
      </aside>
    </div>
  </section>

  <section class="page" id="page-explore"></section>
  <section class="page" id="page-search"></section>
</main>

<footer class="credit">
  <div class="credit-in">
    <span class="credit-seal zh" aria-hidden="true">李</span>
    <p class="credit-txt">Designed by <b><span class="zh">李牧飞</span> Aphisit Kaewnet</b></p>
  </div>
</footer>

<nav class="tabbar" aria-label="เมนูหลัก">

  <a href="#practice" data-nav="practice"><span class="ti zh">写</span><span>ฝึกเขียน</span></a>
  <a href="#explore" data-nav="explore"><span class="ti zh">学</span><span>สำรวจ</span></a>
  <a href="#search" data-nav="search"><span class="ti zh">查</span><span>ค้นหา</span></a>
</nav>

<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true">
  <div class="drawer-grip" aria-hidden="true"></div>
  <button class="drawer-close" id="drawerClose" aria-label="ปิด">×</button>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/app-data.js"></script>
<script src="js/core.js?v=5"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
